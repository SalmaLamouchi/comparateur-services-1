# Application Name
spring.application.name=provider-service

# Server Port (Différent de user-service pour éviter les conflits)
server.port=8084

# PostgreSQL (Utilisation d'une base dédiée aux prestataires)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/provider_db
spring.datasource.username=postgres
spring.datasource.password=salma

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka Client
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
# Permet au service de s'enregistrer avec son adresse IP (utile pour Docker/Gateway)
eureka.instance.prefer-ip-address=true

# Tracing & Observability (Aligné avec votre configuration Zipkin)
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
logging.pattern.level=%5p [traceId=%X{traceId:-},spanId=%X{spanId:-}]

# Actuator & Prometheus (Pour le monitoring via Grafana)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always

# Config Server (Puisque vous avez spring-cloud-starter-config dans votre pom.xml)
# Si vous n'utilisez pas de Config Server, vous pouvez mettre ceci à false
spring.cloud.config.enabled=false